name: Apply Provider Compatibility Fix

on:
  push:
    branches: [fix/provider-compat-20260828]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-compat-20260828

      - name: Apply asserted provider-boundary edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/providers.zig")
          text = path.read_text()

          def once(old: str, new: str, label: str) -> None:
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              text = text.replace(old, new, 1)

          once(
              'fn isSystemInstructionRole(role: []const u8) bool {\n    return std.mem.eql(u8, role, "system") or std.mem.eql(u8, role, "developer");\n}\n',
              'fn isSystemInstructionRole(role: []const u8) bool {\n    return std.mem.eql(u8, role, "system") or std.mem.eql(u8, role, "developer");\n}\n\n/// Hosted GPT-5.6 and Sonnet 5 reject/deprecate legacy sampling temperature.\nfn modelRejectsTemperature(model: []const u8) bool {\n    return std.mem.startsWith(u8, model, "gpt-5.6") or std.mem.eql(u8, model, "claude-sonnet-5");\n}\n',
              "temperature helper",
          )

          once(
              '''/// Write Anthropic-native message (passthrough content as-is, including tool_use/tool_result)
          fn writeAnthropicMessage(w: *std.io.Writer, msg: std.json.Value) !void {
              if (msg != .object) return;
              const content = msg.object.get("content") orelse return;
              if (content != .string) {
                  // Array content is already the official Anthropic representation. Keep
                  // tool_use/tool_result/cache_control blocks byte-for-structure intact.
                  try std.json.Stringify.value(msg, .{}, w);
                  return;
              }

              // Anthropic publicly accepts string shorthand, while Zed's provider parser
          ''',
              '''/// Zed's internal Anthropic RequestContent requires `tool_result.is_error`
          /// even though the public Anthropic API permits omission when the result succeeded.
          fn writeAnthropicContentArray(w: *std.io.Writer, content: std.json.Value) !void {
              try w.writeAll("[");
              for (content.array.items, 0..) |block, index| {
                  if (index > 0) try w.writeAll(",");
                  if (block != .object) {
                      try std.json.Stringify.value(block, .{}, w);
                      continue;
                  }
                  const block_type = switch (block.object.get("type") orelse .null) {
                      .string => |value| value,
                      else => "",
                  };
                  if (!std.mem.eql(u8, block_type, "tool_result") or block.object.get("is_error") != null) {
                      try std.json.Stringify.value(block, .{}, w);
                      continue;
                  }
                  try w.writeAll("{");
                  var first = true;
                  var it = block.object.iterator();
                  while (it.next()) |entry| {
                      if (!first) try w.writeAll(",");
                      first = false;
                      try std.json.Stringify.encodeJsonString(entry.key_ptr.*, .{}, w);
                      try w.writeAll(":");
                      try std.json.Stringify.value(entry.value_ptr.*, .{}, w);
                  }
                  if (!first) try w.writeAll(",");
                  try w.writeAll("\\\"is_error\\\":false}");
              }
              try w.writeAll("]");
          }

          /// Write Anthropic-native message while preserving all client fields.
          fn writeAnthropicMessage(w: *std.io.Writer, msg: std.json.Value) !void {
              if (msg != .object) return;
              const content = msg.object.get("content") orelse return;
              if (content == .array) {
                  try w.writeAll("{");
                  var first = true;
                  var it = msg.object.iterator();
                  while (it.next()) |entry| {
                      if (!first) try w.writeAll(",");
                      first = false;
                      try std.json.Stringify.encodeJsonString(entry.key_ptr.*, .{}, w);
                      try w.writeAll(":");
                      if (std.mem.eql(u8, entry.key_ptr.*, "content")) {
                          try writeAnthropicContentArray(w, entry.value_ptr.*);
                      } else {
                          try std.json.Stringify.value(entry.value_ptr.*, .{}, w);
                      }
                  }
                  try w.writeAll("}");
                  return;
              }
              if (content != .string) {
                  try std.json.Stringify.value(msg, .{}, w);
                  return;
              }

              // Anthropic publicly accepts string shorthand, while Zed's provider parser
          ''',
              "native Anthropic canonicalization",
          )

          tool_anchor = '    if (std.mem.eql(u8, role, "tool")) {'
          start = text.index(tool_anchor)
          end = text.index('        return;\n    }', start) + len('        return;\n    }')
          segment = text[start:end]
          close = '        try w.writeAll("}]}");'
          if segment.count(close) != 1:
              raise SystemExit(f"OpenAI tool result closure: expected 1 match, found {segment.count(close)}")
          segment = segment.replace(close, '        try w.writeAll(",\\\"is_error\\\":false}]}");', 1)
          text = text[:start] + segment + text[end:]

          once(
              '    if (parsed.object.get("temperature")) |temp| {\n        try w.writeAll("\\\"temperature\\\":");\n        try std.json.Stringify.value(temp, .{}, w);\n        try w.writeAll(",");\n    }\n',
              '    if (!modelRejectsTemperature(model)) {\n        if (parsed.object.get("temperature")) |temp| {\n            try w.writeAll("\\\"temperature\\\":");\n            try std.json.Stringify.value(temp, .{}, w);\n            try w.writeAll(",");\n        }\n    }\n',
              "Sonnet temperature omission",
          )

          fn_anchor = 'fn buildNativeResponsesRequest('
          fn_start = text.index(fn_anchor)
          fn_end = text.index('\n}\n\ntest "native Responses keeps the historical GPT 5.5 xhigh policy"', fn_start)
          fn_text = text[fn_start:fn_end]
          instruction_line = '            (instructions != null and std.mem.eql(u8, key, "instructions")))'
          if fn_text.count(instruction_line) != 1:
              raise SystemExit(f"Responses instruction guard: expected 1 match, found {fn_text.count(instruction_line)}")
          fn_text = fn_text.replace(
              instruction_line,
              '            (modelRejectsTemperature(model) and std.mem.eql(u8, key, "temperature")) or\n' + instruction_line,
              1,
          )
          text = text[:fn_start] + fn_text + text[fn_end:]

          path.write_text(text)
          PY

      - name: Install Zig 0.15.2
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Run full Zig tests
        run: zig build test

      - name: Verify Web UI
        run: |
          cd webui
          npm ci --engine-strict
          npm audit --audit-level=low
          npm run build

      - name: Commit only after green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers.zig
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize provider-specific request fields"
          git push origin HEAD:fix/provider-compat-20260828
