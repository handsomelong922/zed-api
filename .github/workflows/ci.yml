name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Run tests
        run: zig build test

      - name: Build embedded Web UI
        run: |
          cd webui
          npm ci
          npm run build

      - name: Build Linux amd64
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux-amd64

      - name: Build Linux arm64
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux-arm64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            zig-out/linux-amd64/bin/zed2api
            zig-out/linux-arm64/bin/zed2api

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  one-port-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zed-api:smoke
      - name: Verify empty accounts file still opens /login
        run: |
          rm -rf /tmp/zed-api-smoke
          mkdir -p /tmp/zed-api-smoke
          printf '%s\n' '{"accounts":{}}' > /tmp/zed-api-smoke/accounts.json
          docker run -d --name zed-api-login-smoke -p 18001:8001 -v /tmp/zed-api-smoke:/data zed-api:smoke
          trap 'docker logs zed-api-login-smoke || true; docker rm -f zed-api-login-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18001/login >/tmp/login.html; then
              grep -q 'Zed API 登录' /tmp/login.html
              grep -q '/login/complete' /tmp/login.html
              exit 0
            fi
            sleep 1
          done
          echo 'empty accounts.json did not enter first-run /login mode' >&2
          exit 1
      - name: Verify main server through the same mapped port with an account
        run: |
          docker rm -f zed-api-login-smoke >/dev/null 2>&1 || true
          printf '%s\n' '{"accounts":{"smoke":{"user_id":"1","credential":{"access_token":"dummy"}}}}' > /tmp/zed-api-smoke/accounts.json
          docker run -d --name zed-api-api-smoke -p 18001:8001 -v /tmp/zed-api-smoke:/data zed-api:smoke
          trap 'docker logs zed-api-api-smoke || true; docker rm -f zed-api-api-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18001/ >/tmp/index.html; then
              grep -qi '<html' /tmp/index.html
              exit 0
            fi
            sleep 1
          done
          echo 'main server was not reachable through the same single Docker port mapping' >&2
          exit 1
      - name: Verify main Web UI remote OAuth can accept a pasted callback
        run: |
          rm -rf /tmp/zed-api-oauth-smoke
          mkdir -p /tmp/zed-api-oauth-smoke
          printf '%s\n' '{"accounts":{"smoke":{"user_id":"1","credential":{"access_token":"dummy"}}}}' > /tmp/zed-api-oauth-smoke/accounts.json
          docker run -d --name zed-api-oauth-smoke -p 18001:8001 -v /tmp/zed-api-oauth-smoke:/data zed-api:smoke
          trap 'docker logs zed-api-oauth-smoke || true; docker rm -f zed-api-oauth-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18001/ >/dev/null && break
            sleep 1
          done

          start_json="$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18001/zed/login)"
          echo "$start_json" | grep -q '"login_url":"https://zed.dev/native_app_signin'

          status_json="$(curl -fsS http://127.0.0.1:18001/zed/login/status)"
          echo "$status_json" | grep -q '"status":"waiting"'
          echo "$status_json" | grep -q '"login_url":"https://zed.dev/native_app_signin'

          complete_code="$(curl -sS -o /tmp/complete.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18001/zed/login/complete)"
          test "$complete_code" = "400"

          cancel_code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST http://127.0.0.1:18001/zed/login/cancel)"
          test "$cancel_code" = "200"
          curl -fsS http://127.0.0.1:18001/zed/login/status | grep -q '"status":"idle"'
