name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Run tests
        run: zig build test

      - name: Build embedded Web UI
        run: |
          cd webui
          npm ci
          npm run build

      - name: Build Linux amd64
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux-amd64

      - name: Build Linux arm64
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux-arm64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            zig-out/linux-amd64/bin/zed2api
            zig-out/linux-arm64/bin/zed2api

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  one-port-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zed-api:smoke
      - name: Verify 1Panel-style port mapping and /login
        run: |
          mkdir -p /tmp/zed-api-smoke
          docker run -d --name zed-api-smoke -p 18001:8001 -v /tmp/zed-api-smoke:/data zed-api:smoke
          trap 'docker logs zed-api-smoke || true; docker rm -f zed-api-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18001/login >/tmp/login.html; then
              grep -q 'Zed API' /tmp/login.html
              exit 0
            fi
            sleep 1
          done
          echo 'container port 8001 was not reachable through Docker port mapping' >&2
          exit 1
