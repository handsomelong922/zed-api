name: Connector Release Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    if: github.event.issue.title == '[release-trigger] zed-api 8c43b40b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build final amd64 image and run builder tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zed-api:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify one-port login and runtime curl
        run: |
          docker run --rm --entrypoint sh zed-api:release-check -c 'command -v curl && curl --version'

          rm -rf /tmp/zed-api-release-login
          mkdir -p /tmp/zed-api-release-login
          printf '%s\n' '{"accounts":{}}' > /tmp/zed-api-release-login/accounts.json
          docker run -d --name zed-api-release-login -p 18001:8001 -v /tmp/zed-api-release-login:/data zed-api:release-check
          trap 'docker logs zed-api-release-login 2>/dev/null || true; docker logs zed-api-release-settings 2>/dev/null || true; docker rm -f zed-api-release-login zed-api-release-settings >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/login >/tmp/release-login.html; then break; fi
            sleep 1
          done
          grep -q 'Zed API 登录' /tmp/release-login.html
          grep -q '/login/complete' /tmp/release-login.html
          docker rm -f zed-api-release-login >/dev/null

      - name: Verify Web API key save rotate persist and clear
        run: |
          rm -rf /tmp/zed-api-release-settings
          mkdir -p /tmp/zed-api-release-settings
          printf '%s\n' '{"accounts":{"smoke":{"user_id":"1","credential":{"access_token":"dummy"}}}}' > /tmp/zed-api-release-settings/accounts.json
          docker run -d --name zed-api-release-settings -p 18001:8001 -v /tmp/zed-api-release-settings:/data zed-api:release-check
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/ >/tmp/release-index.html; then break; fi
            sleep 1
          done
          grep -q 'API Key 设置' /tmp/release-index.html
          grep -q '当前 API Key（验证身份）' /tmp/release-index.html

          curl -fsS http://127.0.0.1:18001/zed/settings/api-key | grep -q '"enabled":false'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"api_key":"web-secret"}' http://127.0.0.1:18001/zed/settings/api-key | grep -q '"source":"file"'

          code="$(curl -sS -o /tmp/release-no-key.json -w '%{http_code}' -X POST http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/release-good-key.json -w '%{http_code}' -X POST -H 'Authorization: Bearer web-secret' http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "200"

          code="$(curl -sS -o /tmp/release-rotate-no-current.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"api_key":"new-secret"}' http://127.0.0.1:18001/zed/settings/api-key)"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/release-rotate-wrong.json -w '%{http_code}' -X POST -H 'Authorization: Bearer wrong-secret' -H 'Content-Type: application/json' -d '{"api_key":"new-secret"}' http://127.0.0.1:18001/zed/settings/api-key)"
          test "$code" = "401"
          curl -fsS -X POST -H 'Authorization: Bearer web-secret' -H 'Content-Type: application/json' -d '{"api_key":"new-secret"}' http://127.0.0.1:18001/zed/settings/api-key | grep -q '"source":"file"'

          code="$(curl -sS -o /tmp/release-old-key.json -w '%{http_code}' -X POST -H 'Authorization: Bearer web-secret' http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/release-new-key.json -w '%{http_code}' -X POST -H 'Authorization: Bearer new-secret' http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "200"

          docker rm -f zed-api-release-settings >/dev/null
          docker run -d --name zed-api-release-settings -p 18001:8001 -v /tmp/zed-api-release-settings:/data zed-api:release-check
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/ >/dev/null; then break; fi
            sleep 1
          done
          code="$(curl -sS -o /tmp/release-persist.json -w '%{http_code}' -X POST -H 'Authorization: Bearer new-secret' http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "200"

          code="$(curl -sS -o /tmp/release-clear-no-current.json -w '%{http_code}' -X DELETE http://127.0.0.1:18001/zed/settings/api-key)"
          test "$code" = "401"
          curl -fsS -X DELETE -H 'Authorization: Bearer new-secret' http://127.0.0.1:18001/zed/settings/api-key | grep -q '"enabled":false'
          code="$(curl -sS -o /tmp/release-open-again.json -w '%{http_code}' -X POST http://127.0.0.1:18001/v1/messages/count_tokens)"
          test "$code" = "200"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish final multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/handsomelong922/zed-api:latest
            ghcr.io/handsomelong922/zed-api:verified-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
